<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Target reticle rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 12" opacity="0.3" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.15" />

  <!-- Corner Reticle brackets -->
  <path d="M 120 180 L 120 120 L 180 120" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <path d="M 392 180 L 392 120 L 332 120" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <path d="M 120 332 L 120 392 L 180 392" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <path d="M 392 332 L 392 392 L 332 392" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

  <!-- Bottle Silhouette -->
  <!-- Cap -->
  <rect x="232" y="110" width="48" height="26" rx="6" fill="#f8fafc" />
  <!-- Neck -->
  <path d="M 238 136 L 274 136 L 274 165 L 238 165 Z" fill="url(#bottleGrad)" />
  <!-- Body with curves -->
  <path d="M 238 165 C 238 190, 190 205, 190 240 L 190 365 C 190 385, 205 395, 225 395 L 287 395 C 307 395, 322 385, 322 365 L 322 240 C 322 205, 274 190, 274 165 Z" fill="url(#bottleGrad)" opacity="0.9" filter="url(#glow)" />

  <!-- Bottle Highlight Lines -->
  <path d="M 212 250 L 212 365" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.4" />
  <path d="M 226 260 L 226 350" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25" />

  <!-- AI Detection Indicator / Recycling Leaf -->
  <circle cx="340" cy="330" r="42" fill="#0f172a" stroke="#10b981" stroke-width="4" filter="url(#glow)" />
  <path d="M 326 332 C 326 318, 340 314, 354 316 C 354 330, 350 344, 336 344 C 330 344, 326 338, 326 332 Z" fill="url(#accentGrad)" />
  <path d="M 334 338 L 348 322" stroke="#047857" stroke-width="2.5" stroke-linecap="round" />
</svg>
